name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project on Windows
        if: runner.os == 'Windows'
        run: npm run verify

      - name: Verify project on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authly-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/latest.yml
            dist/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: authly-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes
